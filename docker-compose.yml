services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: repopilot-backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: repopilot-frontend
    depends_on:
      - backend
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    restart: unless-stopped
